services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: corerag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  corerag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corerag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_MODE=server
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
